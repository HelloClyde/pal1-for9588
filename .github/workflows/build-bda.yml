name: Build BDA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_resources:
        description: Build PAL9588.PAK and PALVIDEO.PAK from the private release branch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-bda-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build native BDA
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache MIPS toolchain
        uses: actions/cache@v6
        with:
          path: sdk/.toolchain
          key: mipsel-toolchain-${{ runner.os }}-${{ hashFiles('sdk/scripts/setup_toolchain.ps1') }}

      - name: Set up verified MIPS toolchain
        shell: pwsh
        run: .\sdk\scripts\setup_toolchain.ps1

      - name: Build BDA
        shell: pwsh
        run: .\tools\build.ps1 -SkipToolchainSetup -Clean

      - name: Verify output and write checksum
        shell: pwsh
        run: |
          $bdaFiles = @(Get-ChildItem -LiteralPath .\build -Filter '*.bda' -File)
          if ($bdaFiles.Count -ne 1) {
            throw "Expected exactly one BDA, found $($bdaFiles.Count)."
          }

          $bda = $bdaFiles[0]
          $hash = (Get-FileHash -LiteralPath $bda.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $bda.DirectoryName ($bda.Name + '.sha256')
          "$hash  $($bda.Name)" | Set-Content -LiteralPath $checksumPath -Encoding utf8

          "### BDA build" >> $env:GITHUB_STEP_SUMMARY
          "- File: ``$($bda.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $($bda.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload BDA artifact
        uses: actions/upload-artifact@v7
        with:
          name: pal1-bda
          path: |
            build/*.bda
            build/*.bda.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  resources:
    name: Build resource packages
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_resources)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out resource conversion tools
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Git LFS and FFmpeg
        shell: pwsh
        run: |
          git lfs version
          if ($LASTEXITCODE -ne 0) {
            throw 'Git LFS is unavailable on this runner.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not initialize Git LFS.'
          }

          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not install FFmpeg.'
            }
          }
          ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) {
            throw 'FFmpeg is unavailable on this runner.'
          }

      - name: Build PAL resource packages
        shell: pwsh
        run: |
          .\tools\prepare-9588-resources.ps1 `
            -ReleaseBranch release `
            -Remote origin

      - name: Write resource checksums
        shell: pwsh
        run: |
          foreach ($name in @('PAL9588.PAK', 'PALVIDEO.PAK')) {
            $path = Join-Path .\build $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing resource package: $name"
            }
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath ($path + '.sha256') -Encoding ascii

            "- ${name}: $($file.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
            "- ${name} SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload resource package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pal1-resources
          path: |
            build/PAL9588.PAK
            build/PAL9588.PAK.sha256
            build/PALVIDEO.PAK
            build/PALVIDEO.PAK.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - resources
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download BDA artifact
        uses: actions/download-artifact@v8
        with:
          name: pal1-bda
          path: release

      - name: Download resource package artifact
        uses: actions/download-artifact@v8
        with:
          name: pal1-resources
          path: release

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bdaFiles = @(Get-ChildItem -LiteralPath .\release -Filter '*.bda' -File)
          if ($bdaFiles.Count -ne 1) {
            throw "Expected exactly one downloaded BDA, found $($bdaFiles.Count)."
          }

          $tag = $env:GITHUB_REF_NAME
          $bda = $bdaFiles[0]
          $publishedBdaName = "PAL1-9588-$tag.bda"
          $publishedBda = Join-Path .\release $publishedBdaName
          Copy-Item -LiteralPath $bda.FullName -Destination $publishedBda -Force
          $publishedBdaChecksum = $publishedBda + '.sha256'
          $publishedBdaHash =
            (Get-FileHash -LiteralPath $publishedBda -Algorithm SHA256).Hash.ToLowerInvariant()
          "$publishedBdaHash  $publishedBdaName" |
            Set-Content -LiteralPath $publishedBdaChecksum -Encoding ascii

          $assets = [System.Collections.Generic.List[string]]::new()
          $assets.Add("$publishedBda#仙剑1.bda")
          $assets.Add("$publishedBdaChecksum#仙剑1.bda.sha256")
          foreach ($name in @(
            'PAL9588.PAK',
            'PAL9588.PAK.sha256',
            'PALVIDEO.PAK',
            'PALVIDEO.PAK.sha256'
          )) {
            $path = Join-Path .\release $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release asset: $name"
            }
            $assets.Add((Resolve-Path -LiteralPath $path).Path)
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $tag `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create release $tag."
            }
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload release asset: $asset"
            }
          }
